name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Overlapping runs would race on the dist commit and the gh-pages push.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: theos rootless build
    # Pinned: ubuntu-latest is migrating to Ubuntu 26, and the Theos installer
    # still expects the older ncurses/toolchain layout.
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    env:
      THEOS: /home/runner/theos
      CACHE_VERSION: "2"

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils build-essential fakeroot rsync curl perl zip git libxml2 libtinfo6

      # Bump CACHE_VERSION to force a fresh Theos checkout.
      - name: Restore Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: /home/runner/theos
          key: theos-v2-${{ runner.os }}-${{ env.CACHE_VERSION }}
          restore-keys: theos-v2-${{ runner.os }}-

      # Theos dropped `make install`; bin/install-theos is the supported path.
      # It refuses to run as root and skips its interactive prompts when $CI is set.
      - name: Install Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        env:
          CI: "true"
        run: |
          export THEOS=/home/runner/theos
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Build packages
        run: |
          export THEOS=/home/runner/theos
          export PATH="$THEOS/bin:$PATH"
          # Theos's `before-package` target depends on $(THEOS_PACKAGE_DIR), which
          # defaults to ./packages (THEOS_BUILD_DIR is ".") and is never created on a
          # clean checkout -> "No rule to make target 'packages'". Pin it to an
          # absolute path we create ourselves.
          #
          # It must NOT live inside $THEOS: the cache step restores all of
          # /home/runner/theos, so debs from a previous run would still be sitting
          # in the package dir and every build would republish stale versions
          # alongside the new one.
          rm -rf "$RUNNER_TEMP/debs"
          mkdir -p "$RUNNER_TEMP/debs"
          # Each subproject is a self-contained package with its own control file;
          # the root project has none, so `make package` there cannot work.
          for d in sb pref; do
            make -C "$d" package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless THEOS_PACKAGE_DIR="$RUNNER_TEMP/debs"
          done

      - name: Collect debs
        run: |
          mkdir -p packages
          find "$RUNNER_TEMP/debs" -maxdepth 1 -name '*.deb' -exec cp {} packages/ \;
          ls -la packages/
          # Fail loudly rather than publishing an index with zero or duplicate packages.
          test "$(ls packages/*.deb | wc -l)" -eq 2

      - name: Upload debs
        uses: actions/upload-artifact@v4
        with:
          name: wipecode-debs
          path: packages/*.deb
          if-no-files-found: error

      # Publish the apt index that Sileo/Zebra consume. Skipped on pull requests
      # and on forks, where the token has no write access.
      - name: Publish apt repo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python3 tools/make-repo.py dist packages/*.deb
          git config user.name "wipecode-ci"
          git config user.email "wipecode-ci@users.noreply.github.com"

          if [ -n "$(git status --porcelain dist)" ]; then
            git add dist
            git commit -m "dist: publish apt index for $(ls packages/*.deb | wc -l) package(s)"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin main; then
                pushed=1
                break
              fi
              echo "main push attempt $attempt failed, retrying"
              sleep 5
            done
            [ "$pushed" -eq 1 ] || { echo "could not push dist/ after 3 attempts" >&2; exit 1; }
          else
            echo "dist/ already up to date"
          fi

          # GitHub Pages is what Sileo actually reads:
          #   https://no-recovery.github.io/WipeCode
          # raw.githubusercontent is not usable as the source. It kept serving a
          # superseded Packages long after the branch had moved on, offering the
          # old crashing build next to the fixed one, so we cannot trust it to
          # reflect the current index.
          SPLIT="$(git subtree split --prefix dist HEAD)"
          git push --force origin "$SPLIT":gh-pages
          echo "pages source: $SPLIT"
